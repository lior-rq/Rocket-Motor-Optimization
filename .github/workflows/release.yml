name: release

# Builds the desktop app for macOS and Windows and attaches both zips to a
# GitHub Release. scripts/build_desktop.py does the actual work (vendor
# prep, PyInstaller, a smoke run, then the zip); this just runs it on both
# platforms and publishes what it produces.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Rebuilt here rather than trusted from the commit, so the release
      # always ships the page its source describes.
      - name: Build the page
        shell: bash
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Install
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-desktop.txt

      # --tag only on an actual release tag, so a manual test run (workflow_
      # dispatch, no tag) can build without matching rocketopt.__version__.
      - name: Build the desktop app
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            python scripts/build_desktop.py --tag "${{ github.ref_name }}"
          else
            python scripts/build_desktop.py
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: dist
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/*.zip \
            --repo "${{ github.repository }}" \
            --title "Rocket Optimizer ${{ github.ref_name }}" \
            --notes-file .github/release-notes.md
